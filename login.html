<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibZel</title>
    <link rel="icon" href="/public/LibZel.png" type="image/png">
    <link href="styles2.css" rel="stylesheet">
    <link href="login.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>
    <div class="promo-section-1">
        <div class="login">
            <h1>Login</h1>
            <h2 id="inc-cre"></h2>
            <form class="login-form" method="get">
                <table>
                    <tr>
                        <td><label for="username" >Username:</label></td>
                        <td><input type="email" placeholder="Enter Email Address" id="username" name="username"></td>
                    </tr>
                    <tr>
                        <td><label for="password" >Password:</label></td>
                        <td><input type="password" placeholder="Enter Email Address" id="password" name="password"></td>
                    </tr>
                    <tr>
                        <td colspan="2"><button type="button" onclick="login()">Sign In</button></td>
                        
                    </tr>
                </table>
            </form>
        </div>
    </div>
</body>
<script type="module" src="script2.js"></script>
</html>
