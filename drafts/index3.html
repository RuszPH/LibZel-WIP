<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RJD Shop</title>
    <link rel="stylesheet" href="styles3.css">
</head>

<body>
    <header>
        <div class="Logo">
            <h1 id="name">
                RJD

        </div>

            <ul>
                <li>Home</li>

                <li>Cart</li>
                <li>Orders</li>
            </ul>

            <input type="search" placeholder="Search Products">
        </div>
        <div class="profile">

        </div>
    </header>
    <main>
        <Section>
            <!--Promotional  poster-->
            <div class="70-promo">
                <h2>

                </h2>
                <a class="buy-now-promo"></a> 
            </div>
            <div class="30-promo">
                <div class="cta-btn">
                    <button id=""  onclick="alerts()">Cick</button>
                    <button id="modalbtn"  onclick="ShowModal()">show mdoal</button>
                </div>
                <div class="message" style="display: none;" id="modal">
                <h2>Do you want to exit?</h2>
                <div class="button-container">
                    <button class="green-btn" id="g-btn" onclick="CloseModal()">Yes</button>
                    <button class="red-btn" id="r-btn">no</button>
                </div>
            </div>
        </Section>
        <section>
            <input type="text" id="newname" >
            <button onclick="changeName()"> click here to change</button>
        </section>
        <section>

        </section>
